group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        // 阿里云镜像 - 优先级最高
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        
        // 腾讯云镜像作为备用
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
        // 华为云镜像作为备用
        maven { url 'https://mirrors.huaweicloud.com/repository/maven' }
        
        // 中科大镜像作为备用
        maven { url 'https://mirrors.ustc.edu.cn/maven/' }
        
        // 添加 JitPack 仓库（用于 GitHub 项目，如 audioswitch）
        maven { url 'https://jitpack.io' }
        
        google()
        mavenCentral()
        maven { url 'file:///C:/Users/Xpdn/.m2/repository' } // 本地 Maven 仓库
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        // 阿里云镜像 - 优先级最高
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        
        // 腾讯云镜像作为备用
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
        
        // 华为云镜像作为备用
        maven { url 'https://mirrors.huaweicloud.com/repository/maven' }
        
        // 中科大镜像作为备用
        maven { url 'https://mirrors.ustc.edu.cn/maven/' }
        
        // 添加 JitPack 仓库（用于 GitHub 项目，如 audioswitch）
        maven { url 'https://jitpack.io' }
        
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
}

dependencies {
//    implementation 'io.github.webrtc-sdk:android:137.7151.04'
    implementation 'zjn.xyz.webrtc-sdk:android:z1.137.7151.05'

    implementation 'com.github.davidliu:audioswitch:89582c47c9a04c62f90aa5e57251af4800a62c9a'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
